# Netlify configuration for a plain static site (no build step)
[build]
  publish = "."

# Serve clean URLs (/donate instead of /donate.html) automatically
[[redirects]]
  from = "/*"
  status = 200
  to = "/:splat"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
